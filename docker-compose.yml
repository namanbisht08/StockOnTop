services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/swing_trader.db

  # Optional local LLM fallback - start with `docker compose --profile ollama up`.
  # Not required: GeminiProvider is tried first, and CandidateAnalyzer degrades
  # to a deterministic-only result if no provider is reachable.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
