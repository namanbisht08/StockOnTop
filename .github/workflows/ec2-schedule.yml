name: EC2 Schedule

# Manual start/stop dropdown for the StockOnTop EC2 instance, plus a fixed
# daily safety-net stop. Automated start-run-stop for the actual weekly/
# daily analysis lives in run-analysis.yml, which SSHes in and runs the job
# directly once the instance is confirmed reachable, rather than starting
# the instance on one timer and hoping the guest's own crontab fires inside
# a matching window (GitHub Actions `schedule` triggers can be delayed tens
# of minutes under load, which previously caused a start-only trigger here
# to miss the guest crontab's slot entirely). Use the manual dropdown when
# you want the box up for debugging/SSH access outside that flow.
#
# The scheduled stop here is a separate safety net: run-analysis.yml only
# stops the instance if IT was the one that started it, so a manual start
# (for debugging, or this workflow's own dropdown) left running would
# otherwise rack up cost indefinitely. This always stops it once a day
# regardless of how or why it was started.
#
# Uses GitHub OIDC to assume an IAM role scoped to start/stop only this one
# instance - no long-lived AWS credentials are stored as secrets.
#
# Note for future debugging: the IAM role's trust policy condition must match
# the actual `sub` claim GitHub issues, which is
# "repo:<owner>@<owner_id>/<repo>@<repo_id>:ref:refs/heads/main" - not the
# plain "repo:<owner>/<repo>:*" shown in most older docs/examples. A trust
# policy using the old format fails with an opaque "Not authorized to
# perform sts:AssumeRoleWithWebIdentity".

on:
  schedule:
    - cron: "30 11 * * *" # 17:00 IST - safety-net stop, every day
  workflow_dispatch:
    inputs:
      action:
        description: "start or stop the instance"
        required: true
        type: choice
        options:
          - start
          - stop

permissions:
  id-token: write
  contents: read

env:
  INSTANCE_ID: i-05dfaf93a4558bc86
  AWS_REGION: us-east-1

jobs:
  manage-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::714361121286:role/StockOnTop-GitHubActions-EC2StartStop
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine action
        id: action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
          else
            echo "action=stop" >> "$GITHUB_OUTPUT"
          fi

      - name: Start instance
        if: steps.action.outputs.action == 'start'
        run: aws ec2 start-instances --instance-ids "$INSTANCE_ID"

      - name: Stop instance
        if: steps.action.outputs.action == 'stop'
        run: aws ec2 stop-instances --instance-ids "$INSTANCE_ID"
