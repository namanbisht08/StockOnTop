name: EC2 Schedule

# Starts the StockOnTop EC2 instance shortly before its cron jobs fire
# (16:20 IST / 10:50 UTC daily) and stops it once they've had time to finish
# (17:00 IST / 11:30 UTC). The instance is EBS-backed, so data/swing_trader.db
# survives the stop/start cycle - only compute is paused, cutting cost from
# 24/7 to ~40 minutes/day. The weekly job (Sunday) and daily job (Mon-Fri)
# both run inside this same window (see crontab on the instance).
#
# Uses GitHub OIDC to assume an IAM role scoped to start/stop only this one
# instance - no long-lived AWS credentials are stored as secrets.

on:
  schedule:
    - cron: "50 10 * * *" # 16:20 IST - start
    - cron: "30 11 * * *" # 17:00 IST - stop
  workflow_dispatch:
    inputs:
      action:
        description: "start or stop the instance"
        required: true
        type: choice
        options:
          - start
          - stop

permissions:
  id-token: write
  contents: read

env:
  INSTANCE_ID: i-05dfaf93a4558bc86
  AWS_REGION: us-east-1

jobs:
  manage-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          python3 -c "
          import base64, json, sys
          payload = '$TOKEN'.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2))
          "

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::714361121286:role/StockOnTop-GitHubActions-EC2StartStop
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine action
        id: action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "50 10 * * *" ]; then
            echo "action=start" >> "$GITHUB_OUTPUT"
          else
            echo "action=stop" >> "$GITHUB_OUTPUT"
          fi

      - name: Start instance
        if: steps.action.outputs.action == 'start'
        run: aws ec2 start-instances --instance-ids "$INSTANCE_ID"

      - name: Stop instance
        if: steps.action.outputs.action == 'stop'
        run: aws ec2 stop-instances --instance-ids "$INSTANCE_ID"
