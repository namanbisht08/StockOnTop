name: Run Analysis

# The sole automated trigger for the weekly scan / daily update. Runs the
# script directly over SSH right after the instance is confirmed reachable,
# instead of starting the instance and hoping its own crontab fires inside a
# narrow window - two independent wall-clock schedules (GitHub's cron to
# start the box, the box's cron to run the job) don't reliably line up:
# GitHub Actions `schedule` triggers are not guaranteed to fire on time and
# can be delayed tens of minutes under load, which previously caused the
# instance to come up (16:42 IST) after the guest crontab's 16:30 IST slot
# had already passed with the box still off - so the job silently never ran.
#
# Starts the instance if it's stopped, waits until SSH is reachable, runs the
# chosen script, then stops the instance again - but only if this workflow
# was the one that started it (leaves it alone if it was already running,
# e.g. someone started it manually via the EC2 Schedule workflow).
#
# Requires a repo secret EC2_SSH_KEY containing the private key that matches
# the ubuntu user's authorized_keys on the instance.

on:
  schedule:
    - cron: "0 10 * * 0" # 15:30 IST Sunday - weekly scan
    - cron: "0 10 * * 1-5" # 15:30 IST Mon-Fri - daily update
  workflow_dispatch:
    inputs:
      job:
        description: "Which analysis job to run"
        required: true
        type: choice
        options:
          - weekly
          - daily

permissions:
  id-token: write
  contents: read

env:
  INSTANCE_ID: i-05dfaf93a4558bc86
  AWS_REGION: us-east-1

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::714361121286:role/StockOnTop-GitHubActions-EC2StartStop
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine job
        id: job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 10 * * 0" ]; then
            echo "job=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "job=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure instance is running and resolve its IP
        id: ensure
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" --output text)

          WAS_RUNNING=true
          if [ "$STATE" != "running" ]; then
            WAS_RUNNING=false
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
          fi

          IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)

          echo "was_running=$WAS_RUNNING" >> "$GITHUB_OUTPUT"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Run job over SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          INSTANCE_IP: ${{ steps.ensure.outputs.ip }}
          JOB: ${{ steps.job.outputs.job }}
        run: |
          umask 077
          printf '%s\n' "$SSH_KEY" > key.pem
          chmod 600 key.pem

          SCRIPT="daily_run.sh"
          if [ "$JOB" = "weekly" ]; then
            SCRIPT="weekly_run.sh"
          fi

          for i in $(seq 1 10); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -i key.pem "ubuntu@$INSTANCE_IP" true; then
              break
            fi
            sleep 5
          done

          ssh -o StrictHostKeyChecking=no -i key.pem "ubuntu@$INSTANCE_IP" \
            "cd /home/ubuntu/StockOnTop && ./$SCRIPT"
          rm -f key.pem

      - name: Stop instance (only if this run started it)
        if: always() && steps.ensure.outputs.was_running == 'false'
        run: aws ec2 stop-instances --instance-ids "$INSTANCE_ID"
